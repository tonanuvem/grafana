global: { scrape_interval: 15s, evaluation_interval: 15s }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [ { targets: ['alertmanager:9093'] } ]

scrape_configs:
  # As metricas RED e o Service Map, derivados dos traces pelo collector.
  - job_name: otel-derivadas
    static_configs: [ { targets: ['otelcol:8889'] } ]

  # Eventos de deploy/rollback. honor_labels para preservar servico/versao.
  - job_name: deploys
    honor_labels: true
    static_configs: [ { targets: ['pushgateway:9091'] } ]

  # O proprio Alertmanager: e' de onde sai alertmanager_notifications_total,
  # o numero que o exercicio de reducao de ruido compara com os alertas.
  - job_name: alertmanager
    static_configs: [ { targets: ['alertmanager:9093'] } ]

  - job_name: prometheus
    static_configs: [ { targets: ['localhost:9090'] } ]

  # ---------------------------------------------------------------------------
  # Infraestrutura -- pasta "LAB GRAFANA - System Health"
  # ---------------------------------------------------------------------------

  # A telemetria INTERNA do collector (8888), que nao e' a mesma coisa que as
  # metricas derivadas dos traces (8889). Esta responde "o pipeline esta
  # entregando?"; sem ela, um collector recusando spans nao aparece em lugar
  # nenhum e todos os outros paineis mentem em silencio.
  - job_name: otelcol-interno
    static_configs: [ { targets: ['otelcol:8888'] } ]

  - job_name: node
    static_configs: [ { targets: ['node-exporter:9100'] } ]

  - job_name: cadvisor
    static_configs: [ { targets: ['cadvisor:8080'] } ]
